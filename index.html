<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power of Abidos - Polished Build</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        
        .card-shadow { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6); }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1e293b; /* Softer Slate Background */
            color: #f8fafc;
            -webkit-user-select: none; user-select: none;
        }
        input { user-select: auto !important; }
        
        /* Resource Color Palette */
        .txt-white { color: #ffffff !important; }
        .txt-orange { color: #fb923c !important; } /* Powder */
        .txt-green { color: #4ade80 !important; }  /* Tender */
        .txt-blue { color: #60a5fa !important; }   /* Sturdy */
        
        /* Subtle Abidos Glow */
        .txt-abidos { 
            color: #38bdf8 !important; 
            text-shadow: 0 0 5px rgba(14, 165, 233, 0.4);
            font-weight: 700;
        }

        /* Improved Grid Alignment */
        .result-row {
            display: grid;
            grid-template-columns: 160px 1fr; /* Slightly wider for full names */
            gap: 1rem;
            align-items: center;
            padding: 4px 0;
        }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }

        function calculateFusion(timber, loggingPowder, tenderTimber, sturdyTimber, abidosTimber) {
            let fusionMaterial = 0;
            let sturdy_to_timber_times = 0, timber_to_powder_times = 0, tender_to_powder_times = 0;
            let powder_to_tender_times = 0, powder_to_abidos_times = 0;

            // Step 0: Sturdy Conversion
            while (sturdyTimber >= 5) {
                sturdyTimber -= 5;
                timber += 50;
                sturdy_to_timber_times++;
            }

            let changed = true;
            while (changed) {
                changed = false;
                if (abidosTimber >= 43 && tenderTimber >= 59 && timber >= 112) {
                    abidosTimber -= 43;
                    tenderTimber -= 59;
                    timber -= 112;
                    fusionMaterial += 10;
                    changed = true;
                    continue;
                }
                if (loggingPowder >= 100) {
                    if (abidosTimber < 43) {
                        loggingPowder -= 100;
                        abidosTimber += 10;
                        powder_to_abidos_times++;
                        changed = true;
                        continue;
                    } else if (tenderTimber < 59) {
                        loggingPowder -= 100;
                        tenderTimber += 50;
                        powder_to_tender_times++;
                        changed = true;
                        continue;
                    }
                }
                if (abidosTimber < 43 || tenderTimber < 59) {
                    if (timber >= 212) {
                        timber -= 100;
                        loggingPowder += 80;
                        timber_to_powder_times++;
                        changed = true;
                    } else if (tenderTimber >= 109) {
                        tenderTimber -= 50;
                        loggingPowder += 80;
                        tender_to_powder_times++;
                        changed = true;
                    }
                }
            }

            return {
                sturdy_to_timber: { times: sturdy_to_timber_times, total: sturdy_to_timber_times * 50 },
                timber_to_powder: { times: timber_to_powder_times, total: timber_to_powder_times * 80 },
                tender_to_powder: { times: tender_to_powder_times, total: tender_to_powder_times * 80 },
                powder_to_tender: { times: powder_to_tender_times, total: powder_to_tender_times * 50 },
                powder_to_abidos: { times: powder_to_abidos_times, total: powder_to_abidos_times * 10 },
                fusion_material: fusionMaterial,
                stacks: Math.floor(fusionMaterial / 10)
            };
        }

        function performCalculation() {
            const timber = parseInt(document.getElementById('input-timber').value) || 0;
            const loggingPowder = parseInt(document.getElementById('input-powder').value) || 0;
            const tenderTimber = parseInt(document.getElementById('input-tender').value) || 0;
            const sturdyTimber = parseInt(document.getElementById('input-sturdy').value) || 0;
            const abidosTimber = parseInt(document.getElementById('input-abidos').value) || 0;

            const res = calculateFusion(timber, loggingPowder, tenderTimber, sturdyTimber, abidosTimber);

            document.getElementById('result-fusion').textContent = res.fusion_material.toLocaleString();
            document.getElementById('result-stacks').textContent = res.stacks.toLocaleString();
            
            document.getElementById('stat-sturdy').innerHTML = 
                `<span class="txt-white">${res.sturdy_to_timber.times}x</span> (+<span class="txt-white">${res.sturdy_to_timber.total}</span> <span class="txt-white">Timber</span>)`;
            
            document.getElementById('stat-timber-powder').innerHTML = 
                `<span class="txt-white">${res.timber_to_powder.times}x</span> (+<span class="txt-white">${res.timber_to_powder.total}</span> <span class="txt-orange">Powder</span>)`;
            
            document.getElementById('stat-tender-powder').innerHTML = 
                `<span class="txt-white">${res.tender_to_powder.times}x</span> (+<span class="txt-white">${res.tender_to_powder.total}</span> <span class="txt-orange">Powder</span>)`;
            
            document.getElementById('stat-powder-tender').innerHTML = 
                `<span class="txt-white">${res.powder_to_tender.times}x</span> (+<span class="txt-white">${res.powder_to_tender.total}</span> <span class="txt-green">Tender</span>)`;
            
            document.getElementById('stat-powder-abidos').innerHTML = 
                `<span class="txt-white">${res.powder_to_abidos.times}x</span> (+<span class="txt-white">${res.powder_to_abidos.total}</span> <span class="txt-abidos">Abidos</span>)`;
        }

        window.onload = performCalculation;
    </script>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-800 card-shadow w-full md:max-w-5xl rounded-3xl p-6 lg:p-10 grid grid-cols-1 lg:grid-cols-2 gap-8 border border-slate-700">
        
        <div class="flex flex-col h-full space-y-6">
            <div>
                <h1 class="text-3xl font-black text-white tracking-tight">Power of Abidos</h1>
                <p class="text-xs text-sky-400 font-mono uppercase tracking-widest mt-1">Created by Excoupe</p>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div class="col-span-1">
                    <label class="text-[10px] font-bold text-white-400 uppercase tracking-wider mb-1 block">Timber</label>
                    <input type="number" id="input-timber" value="150" oninput="performCalculation()" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-right font-bold text-white focus:border-sky-500 outline-none transition-all">
                </div>
                <div class="col-span-1">
                    <label class="text-[10px] font-bold text-orange-400 uppercase tracking-wider mb-1 block">Logging Powder</label>
                    <input type="number" id="input-powder" value="50" oninput="performCalculation()" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-right font-bold text-white focus:border-orange-500 outline-none transition-all">
                </div>
                <div class="col-span-1">
                    <label class="text-[10px] font-bold text-green-400 uppercase tracking-wider mb-1 block">Tender Timber</label>
                    <input type="number" id="input-tender" value="50" oninput="performCalculation()" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-right font-bold text-white focus:border-green-500 outline-none transition-all">
                </div>
                <div class="col-span-1">
                    <label class="text-[10px] font-bold text-blue-400 uppercase tracking-wider mb-1 block">Sturdy Timber</label>
                    <input type="number" id="input-sturdy" value="5" oninput="performCalculation()" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-right font-bold text-white focus:border-blue-500 outline-none transition-all">
                </div>
                <div class="col-span-2">
                    <label class="text-[10px] font-bold text-sky-400 uppercase tracking-wider mb-1 block">Abidos Timber</label>
                    <input type="number" id="input-abidos" value="45" oninput="performCalculation()" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-right font-bold text-white focus:border-sky-300 outline-none transition-all">
                </div>
            </div>

            <button onclick="['input-timber','input-powder','input-tender','input-sturdy','input-abidos'].forEach(id=>document.getElementById(id).value='0'); performCalculation();" class="mt-auto w-full py-4 bg-rose-600/10 hover:bg-rose-600/20 text-rose-400 border border-rose-500/20 font-bold rounded-xl transition-all">Clear Resources</button>
        </div>

        <div class="bg-slate-950/50 p-8 rounded-2xl flex flex-col border border-slate-900">
            <div class="text-center pb-8 border-b border-slate-800">
                <p class="text-slate-500 text-[10px] font-bold uppercase tracking-widest mb-3">Est. Advanced Fusion Materials</p>
                <div class="text-7xl font-black text-white leading-none" id="result-fusion">0</div>
                <p class="text-slate-600 text-sm mt-4 font-medium uppercase tracking-tighter"><span id="result-stacks" class="text-slate-300">0</span> Stacks</p>
            </div>

            <div class="mt-8 space-y-8">
                <div>
                    <p class="text-slate-600 text-[10px] font-bold uppercase tracking-widest mb-4 flex items-center gap-2">
                        <span class="w-1.5 h-1.5 bg-sky-500 rounded-full"></span> Resource to Powder
                    </p>
                    <ul class="space-y-4">
                        <li class="result-row">
                            <span class="text-xs font-semibold text-slate-500 uppercase tracking-tight"><span class="txt-blue">Sturdy</span> → <span class="txt-white">Timber</span></span>
                            <span id="stat-sturdy" class="text-sm font-bold"></span>
                        </li>
                        <li class="result-row">
                            <span class="text-xs font-semibold text-slate-500 uppercase tracking-tight"><span class="txt-white">Timber</span> → <span class="txt-orange">Powder</span></span>
                            <span id="stat-timber-powder" class="text-sm font-bold"></span>
                        </li>
                        <li class="result-row">
                            <span class="text-xs font-semibold text-slate-500 uppercase tracking-tight"><span class="txt-green">Tender</span> → <span class="txt-orange">Powder</span></span>
                            <span id="stat-tender-powder" class="text-sm font-bold"></span>
                        </li>
                    </ul>
                </div>

                <div>
                    <p class="text-slate-600 text-[10px] font-bold uppercase tracking-widest mb-4 flex items-center gap-2">
                        <span class="w-1.5 h-1.5 bg-orange-500 rounded-full"></span> Powder to Resource
                    </p>
                    <ul class="space-y-4">
                        <li class="result-row">
                            <span class="text-xs font-semibold text-slate-500 uppercase tracking-tight"><span class="txt-orange">Powder</span> → <span class="txt-green">Tender</span></span>
                            <span id="stat-powder-tender" class="text-sm font-bold"></span>
                        </li>
                        <li class="result-row">
                            <span class="text-xs font-semibold text-slate-500 uppercase tracking-tight"><span class="txt-orange">Powder</span> → <span class="txt-abidos">Abidos</span></span>
                            <span id="stat-powder-abidos" class="text-sm font-bold"></span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
